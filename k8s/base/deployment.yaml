apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
  labels:
    app.kubernetes.io/name: logto
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: logto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logto
      annotations:
        gitlab.com/redeploy-trigger: "REDEPLOY_TRIGGER_PLACEHOLDER"
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      initContainers:
        - name: logto-db-migration
          image: registry.invalid/logto:ci-placeholder
          command:
            - "sh"
            - "-c"
            - >
              node -e "
              const { Client } = require('pg');
              const client = new Client({ connectionString: process.env.DB_URL });
              client.connect().then(async () => {
                console.log('Cleaning up old roles...');
                const res = await client.query(\"SELECT rolname FROM pg_roles WHERE rolname LIKE 'logto_tenant_%'\");
                for (let row of res.rows) {
                  try {
                    await client.query('DROP OWNED BY \"' + row.rolname + '\" CASCADE');
                    await client.query('DROP ROLE \"' + row.rolname + '\"');
                    console.log('Dropped ' + row.rolname);
                  } catch (e) { console.error('Failed to drop ' + row.rolname, e.message); }
                }
                process.exit(0);
              }).catch(e => { console.error(e); process.exit(0); });
              " && npm run cli db seed && npm run cli db alteration deploy
          envFrom:
            - configMapRef:
                name: logto-config
            - secretRef:
                name: logto-secrets
                optional: true
      containers:
        - name: logto
          image: registry.invalid/logto:ci-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 3001
            - name: admin
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: logto-config
            - secretRef:
                name: logto-secrets
                optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /status
              port: api
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
