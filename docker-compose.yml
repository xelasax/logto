version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=logto
      - POSTGRES_PASSWORD=logto
      - POSTGRES_DB=logto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  logto:
    image: logto-custom:latest
    depends_on:
      - postgres
    environment:
      - DB_URL=postgres://logto:logto@postgres:5432/logto
      - TRUST_PROXY_HEADER=1
      - ENDPOINT=http://localhost:3001
      - ADMIN_ENDPOINT=http://localhost:3002
    ports:
      - "3001:3001"
      - "3002:3002"
    # The Logto image uses ENTRYPOINT ["npm", "run"], so we override it to run a shell command
    entrypoint: /bin/sh
    command: -c "npm run cli db seed -- --swe && npm run start"

volumes:
  postgres_data:
