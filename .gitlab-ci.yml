# GitLab CI/CD – custom-oauth-server
# Every job runs ONLY on the `custom-oauth-server` branch.
# The Docker image is published to the GitLab Container Registry on every
# successful push when ALL stages pass.
#
# Registry path (on gitlab.com):
#   registry.gitlab.com/<group>/<project>/logto:custom-oauth-server
#
# Limits
# ──────────────────────────────────────────────────────────────────────────────
# - `rules` – pipeline is triggered only on push to custom-oauth-server
# - `only/except` – no other branch or tag can accidentally start a pipeline
# - Lint job is filtered to the connector package only (avoids upstream failures)

variables:
  # $CI_REGISTRY and $CI_REGISTRY_USER are predefined by GitLab.
  # Use $CI_REGISTRY_IMAGE so the image name is always correct regardless
  # of the registry host (gitlab.com or a self-hosted instance).
  IMAGE_NAME: $CI_REGISTRY_IMAGE/logto
  # Enable BuildKit so Dockerfile RUN --mount works in dind
  DOCKER_BUILDKIT: "1"
  # Speed up pip install / compilation in Alpine containers
  PIP_NO_CACHE_DIR: "1"

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 – Validate (lint only)
# ─────────────────────────────────────────────────────────────────────────────
lint:
  stage: .pre
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
  before_script:
    - npm add --location=global pnpm@^10.0.0
    - apk add --no-cache python3 make g++ bash
  cache:
    key: "${CI_COMMIT_REF_SLUG}-deps"
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    - pnpm i --frozen-lockfile
    # Lint only the connector we own (avoids unrelated upstream type failures)
    - pnpm --filter "@logto/connector-local-sms-service" lint

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2 – Build Docker image and push to the GitLab Container Registry
#
# Runs on every push to custom-oauth-server.
# Pushes two tags:
#   <project>/logto:custom-oauth-server   (immutable per-commit snapshot)
#   <project>/logto:latest                (the most recently published snapshot)
#
# A sanity check before push verifies the connector binary is present in the
# image so broken builds are caught before the registry is updated.
# ─────────────────────────────────────────────────────────────────────────────
.build-and-push:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
  only:
    - custom-oauth-server
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG="$CI_COMMIT_BRANCH"
      fi
    - echo "Building image: $IMAGE_NAME:$TAG"
    # Mount a host-level BuildKit cache for persistent layer reuse across runs
    - |
      docker buildx create --use --name logto-builder 2>/dev/null || true
    - |
      docker buildx build --pull \
        --build-arg ADDITIONAL_CONNECTOR_ARGS="--all" \
        -t "$IMAGE_NAME:$TAG" \
        -t "$IMAGE_NAME:latest" \
        --load \
        .
    # Verify the connector exists in the built image
    - |
      docker run --rm "$IMAGE_NAME:$TAG" \
        ls /etc/logto/packages/connectors/connector-local-sms-service/lib/ \
        | grep index.js
    - docker push "$IMAGE_NAME:$TAG"
    - docker push "$IMAGE_NAME:latest"
    - echo "Published: $IMAGE_NAME:$TAG"
  tags:
    - docker

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3 – E2E smoke test
#
# Starts the image that was just pushed to the registry and confirms the API
# is reachable.  Runs only after the build-and-push job succeeds so a failure
# in the smoke test implies the previously published image is broken.
# ─────────────────────────────────────────────────────────────────────────────
.e2e:
  stage: e2e
  image: alpine:3.19
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
  services:
    - postgres:17-alpine
    - redis:7-alpine
  variables:
    DB_URL: postgres://postgres:p0stgr3s@postgres:5432/logto
    REDIS_URL: redis://redis:6379
    TRUST_PROXY_HEADER: "1"
    PRIVATE_KEY_ROTATION_GRACE_PERIOD: "0"
  before_script:
    - apk add --no-cache curl
  script:
    - docker pull "$IMAGE_NAME:$CI_COMMIT_BRANCH"
    - |
      docker run -d --rm \
        --name logto-e2e \
        -e DB_URL \
        -e REDIS_URL \
        -e TRUST_PROXY_HEADER \
        -e PRIVATE_KEY_ROTATION_GRACE_PERIOD \
        -p "3001:3001" \
        "$IMAGE_NAME:$CI_COMMIT_BRANCH" \
        sh -c "npm run cli db seed -- --swe && npm start"
    # Wait up to ~5 min for cold-start to complete
    - |
      echo "Waiting for Logto to become healthy..."
      for i in $(seq 1 60); do
        if curl -sf http://localhost:3001/api/configs/admin-console > /dev/null 2>&1; then
          echo "Logto is healthy!"
          break
        fi
        echo "Waiting... ($i/60)"
        sleep 5
      done
    # Sanity-check the connectors endpoint confirms the connector package is loaded
    - |
      curl -s -f http://localhost:3001/api/connectors \
        | grep -o '"id": "[^"]*"' | sort | uniq | head -c 400
  after_script:
    - docker rm -f logto-e2e 2>/dev/null || true
  tags:
    - docker
