# GitLab CI/CD – custom-oauth-server
#
# Pipeline is triggered MANUALLY from the GitLab UI.
# To run: Pipelines → Run pipeline → select `custom-oauth-server` or `master`
#
# Published images:
#   registry.gitlab.com/$CI_PROJECT_PATH/logto:custom-oauth-server   (feature branch)
#   registry.gitlab.com/$CI_PROJECT_PATH/logto:master                 (release / stable)
#   registry.gitlab.com/$CI_PROJECT_PATH/logto:latest                (most recently published snapshot)
#
# Stages (run sequentially when triggered):
#   .pre    → lint         (lint only the connector to avoid upstream failures)
#   build   → build+push   (docker buildx, push to GitLab Container Registry)
#   e2e     → smoke test   (pull from registry, start, curl health + connectors API)

# ─────────────────────────────────────────────────────────────────────────────
# Workflow: pipeline only created when triggered manually from the GitLab UI.
# No pipeline is ever created automatically on push or merge.
# ─────────────────────────────────────────────────────────────────────────────
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  # $CI_REGISTRY_IMAGE is always correct regardless of GitLab host
  IMAGE_NAME: $CI_REGISTRY_IMAGE/logto
  # Enable BuildKit so Dockerfile RUN --mount works correctly in dind
  DOCKER_BUILDKIT: "1"
  # Prevent pip from writing bytecode / cache
  PIP_NO_CACHE_DIR: "1"

# ─────────────────────────────────────────────────────────────────────────────
# Stage .pre – Lint (only the connector; full monorepo lint is not guarded)
# ─────────────────────────────────────────────────────────────────────────────
lint:
  stage: .pre
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    - npm add --location=global pnpm@^10.0.0
    - apk add --no-cache python3 make g++ bash
  cache:
    key: "${CI_COMMIT_REF_SLUG}-deps"
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    - pnpm i --frozen-lockfile
    # Scope to the connector we own so unrelated packages cannot fail the pipeline
    - pnpm --filter "@logto/connector-local-sms-service" lint

# ─────────────────────────────────────────────────────────────────────────────
# Stage build – Docker build, connector sanity check, and push to registry
#
# Runs when the pipeline is triggered manually on custom-oauth-server or master.
# Tags:  :custom-oauth-server  (feature – immutable per-commit)
#        :master               (stable / release)
#        :latest               (most recently published, from either branch)
# ─────────────────────────────────────────────────────────────────────────────
build-image:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
    - if: $CI_COMMIT_BRANCH == "master"
  tags:
    - docker
  before_script:
    # Authenticate with the GitLab Container Registry using the CI job token
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    # Select tag: use the git tag if this pipeline is triggered by a tag,
    # otherwise use the branch name as a human-readable tag.
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG="$CI_COMMIT_BRANCH"
      fi
    - echo "Building image: $IMAGE_NAME:$TAG"
    # Use buildx so --mount cache directives in the Dockerfile work in dind
    - |
      docker buildx create --use --name logto-builder 2>/dev/null || true
    # Build -> load into local daemon -> verify -> push
    - |
      docker buildx build --pull \
        --progress=plain \
        --build-arg additional_connector_args="--all" \
        -t "$IMAGE_NAME:$TAG" \
        -t "$IMAGE_NAME:latest" \
        --load \
        .
    # Sanity check: connector binary must be present in the image
    - |
      docker run --rm "$IMAGE_NAME:$TAG" \
        ls /etc/logto/packages/connectors/connector-local-sms-service/lib/ \
        | grep index.js
    # Push both tags
    - docker push "$IMAGE_NAME:$TAG"
    - docker push "$IMAGE_NAME:latest"
    - echo "Published → $IMAGE_NAME:$TAG"

# ─────────────────────────────────────────────────────────────────────────────
# Stage e2e – Smoke test
#
# Pulls the image FROM the registry (confirms push succeeded), starts it,
# waits for healthy, and verifies the connectors API.
# Runs on custom-oauth-server and master.
# ─────────────────────────────────────────────────────────────────────────────
e2e:
  stage: e2e
  image: alpine:3.19
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
    - if: $CI_COMMIT_BRANCH == "master"
  services:
    - postgres:17-alpine
    - redis:7-alpine
  variables:
    DB_URL: postgres://postgres:p0stgr3s@postgres:5432/logto
    REDIS_URL: redis://redis:6379
    TRUST_PROXY_HEADER: "1"
    PRIVATE_KEY_ROTATION_GRACE_PERIOD: "0"
  tags:
    - docker
  before_script:
    - apk add --no-cache curl
  script:
    # Pull the image that was just pushed to the registry (not the local cache)
    - docker pull "$IMAGE_NAME:$CI_COMMIT_BRANCH"
    - |
      docker run -d --rm \
        --name logto-e2e \
        -e DB_URL \
        -e REDIS_URL \
        -e TRUST_PROXY_HEADER \
        -e PRIVATE_KEY_ROTATION_GRACE_PERIOD \
        -p "3001:3001" \
        "$IMAGE_NAME:$CI_COMMIT_BRANCH" \
        sh -c "npm run cli db seed -- --swe && npm start"
    # Wait up to 5 minutes for cold-start
    - |
      echo "Waiting for Logto to become healthy..."
      for i in $(seq 1 60); do
        if curl -sf http://localhost:3001/api/configs/admin-console > /dev/null 2>&1; then
          echo "OK — Logto is healthy (attempt $i)"
          break
        fi
        echo "Not ready yet ($i/60)"
        sleep 5
      done
    # Verify the connectors API is reachable and shows connector IDs
    - |
      echo "Connector IDs loaded in the image:"
      curl -s -f http://localhost:3001/api/connectors \
        | grep -o '"id": "[^"]*"' | sort | uniq
  after_script:
    - docker rm -f logto-e2e 2>/dev/null || true
