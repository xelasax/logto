# GitLab CI/CD configuration for Logto Custom OAuth Server
# Image is ONLY built and pushed on the `custom-oauth-server` branch.
# Lint runs on merge requests; type-check is intentionally excluded because
# TypeScript type resolution for workspace packages (@logto/connector-kit,
# @logto/language-kit) requires those packages to be built first — the Docker
# build stage handles a full `pnpm -r build` which gives authoritative results.
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   DOCKER_HOST  - Docker daemon socket (default: unix:///var/run/docker.sock)
#
# Registry path:
#   registry.gitlab.com/$CI_PROJECT_PATH/logto:$CI_COMMIT_TAG
#   registry.gitlab.com/$CI_PROJECT_PATH/logto:$CI_COMMIT_SHORT_SHA   (= custom-oauth-server)

variables:
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: $CI_REGISTRY/$CI_PROJECT_PATH/logto

# -----------------------------------------------------------------------
# Stage 1: Validate (lint only)
# -----------------------------------------------------------------------
.validate:
  stage: .pre
  image: node:22-alpine
  before_script:
    - npm add --location=global pnpm@^10.0.0
    - apk add --no-cache python3 make g++ bash
  cache:
    key: "${CI_COMMIT_REF_SLUG}-deps"
    paths:
      - node_modules/
      - .pnpm-store/

lint:
  extends: .validate
  script:
    - pnpm i --frozen-lockfile
    - pnpm -r --parallel lint
  only:
    - merge_requests
    - custom-oauth-server
  except:
    - tags

# -----------------------------------------------------------------------
# Stage 2: Build Docker image + push to GitLab Container Registry
# Only runs on the `custom-oauth-server` branch.
# -----------------------------------------------------------------------
.build-and-push:
  image: docker:26-cli
  stage: build
  services:
    - docker:26-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    # Tag: <branch-name> for branch commits, :<tag> for tags
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG="$CI_COMMIT_BRANCH"
      fi
    - echo "Building image: $IMAGE_NAME:$TAG"
    - |
      docker build --pull \
        --build-arg additional_connector_args="--all" \
        -t "$IMAGE_NAME:$TAG" \
        -t "$IMAGE_NAME:latest" \
        .
    # Verify the local-sms-service connector is present in the image
    - |
      docker run --rm "$IMAGE_NAME:$TAG" \
        ls /etc/logto/packages/connectors/connector-local-sms-service/lib/ | grep index.js
    # Push to GitLab Container Registry
    - docker push "$IMAGE_NAME:$TAG"
    - echo "Image pushed to $IMAGE_NAME:$TAG"
  only:
    - custom-oauth-server
    - tags
  tags:
    - docker

# -----------------------------------------------------------------------
# Stage 3: E2E smoke test (only on custom-oauth-server)
# -----------------------------------------------------------------------
.e2e:
  image: alpine:3.19
  stage: e2e
  services:
    - postgres:17-alpine
    - redis:7-alpine
  variables:
    DB_URL: postgres://postgres:p0stgr3s@postgres:5432/logto
    REDIS_URL: redis://redis:6379
    TRUST_PROXY_HEADER: "1"
    PRIVATE_KEY_ROTATION_GRACE_PERIOD: "0"
  before_script:
    - apk add --no-cache curl
  script:
    # Pull and run the image we just pushed
    - docker pull "$IMAGE_NAME:$CI_COMMIT_BRANCH" || true
    - |
      docker run -d --rm \
        --name logto-e2e \
        -e DB_URL \
        -e REDIS_URL \
        -e TRUST_PROXY_HEADER \
        -e PRIVATE_KEY_ROTATION_GRACE_PERIOD \
        -p "3001:3001" \
        "$IMAGE_NAME:$CI_COMMIT_BRANCH" \
        sh -c "npm run cli db seed -- --swe && npm start"
    # Wait for Logto to start
    - |
      for i in $(seq 1 60); do
        if curl -sf http://localhost:3001/api/configs/admin-console > /dev/null 2>&1; then
          echo "Logto is healthy!"
          break
        fi
        sleep 5
      done
    # Verify the connector API is alive
    - curl -sf -H "Authorization: Bearer test" http://localhost:3001/api/connectors | head -c 500
  after_script:
    - docker rm -f logto-e2e 2>/dev/null || true
  only:
    - custom-oauth-server
  tags:
    - docker
