# GitLab CI/CD configuration for Logto Custom OAuth Server
# This pipeline builds the Logto Docker image (with all connectors, including local-sms-service)
# and pushes it to the GitLab Container Registry.
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   DOCKER_HOST              - Docker daemon socket (default: unix:///var/run/docker.sock)
#
# For GitLab.com, the registry is automatically available at:
#   registry.gitlab.com/$CI_PROJECT_PATH/logto:$CI_COMMIT_TAG or :$CI_COMMIT_SHORT_SHA

# Use Docker-in-Docker for building images
# A service image with Docker already pre-installed is available on Linux runners.
# For shared runners on GitLab.com, use the `docker` service tag.
variables:
  # Use Docker Hub mirror for faster layer downloads (GitLab.com is in EU)
  DOCKER_HOST: unix:///var/run/docker.sock
  REGISTRY: registry.gitlab.com
  IMAGE_NAME: $CI_REGISTRY/$CI_PROJECT_PATH/logto

# -----------------------------------------------------------------------
# Stage 1: Validate
# -----------------------------------------------------------------------
.validate:
  stage: .pre
  image: node:22-alpine
  before_script:
    # Install pnpm matching the project's engine requirement
    - npm add --location=global pnpm@^10.0.0
    - apk add --no-cache python3 make g++
  cache:
    paths:
      - node_modules/
      - .pnpm-store/

lint:
  extends: .validate
  script:
    - pnpm i --frozen-lockfile
    - pnpm -r --parallel lint
  only:
    - merge_requests
    - branches
  except:
    - tags

type-check:
  extends: .validate
  script:
    - pnpm i --frozen-lockfile
    - pnpm -r check
  only:
    - merge_requests
    - branches
  except:
    - tags

# -----------------------------------------------------------------------
# Stage 2: Test
# -----------------------------------------------------------------------
test:
  image: node:22-alpine
  stage: test
  services:
    - postgres:17-alpine
    - redis:7-alpine
  variables:
    DB_URL: postgres://postgres:p0stgr3s@postgres:5432/postgres
    REDIS_URL: redis://redis:6379
    SECRET_VAULT_KEK: DtPWS09unRXGuRScB60qXqCSsrjd22dUlXt/0oZgxSo=
  before_script:
    - npm add --location=global pnpm@^10.0.0
    - apk add --no-cache python3 make g++ bash
  cache:
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    # Install deps
    - pnpm i --frozen-lockfile
    # Build all packages including the new local-sms-service connector
    - pnpm -r build
    # Link connectors in the built workspace
    - pnpm cli connector link -p .
    # Install production deps (no dev deps)
    - NODE_ENV=production pnpm i
    # Run integration tests (connector tests require a running Logto instance;
    #  this pipeline runs unit tests during the build; see integration job below)
    - pnpm test:scripts
  only:
    - merge_requests
    - branches
  except:
    - tags

# -----------------------------------------------------------------------
# Stage 3: Docker Build & Push
# -----------------------------------------------------------------------
.build-push-docker:
  image: docker:26-cli
  stage: build
  services:
    - docker:26-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # Log in to the GitLab Container Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    # Determine image tags:
    #  - branch builds:  :<branch-name>
    #  - merge requests: :mr-<iid>
    #  - tags (release): :<tag>
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      elif [ "$CI_MERGE_REQUEST_IID" ]; then
        TAG="mr-$CI_MERGE_REQUEST_IID"
      else
        TAG="$CI_COMMIT_BRANCH"
      fi
    - echo "Building image: $IMAGE_NAME:$TAG"
    # Build the image using the multi-stage Dockerfile (includes local-sms-service connector)
    - docker build --pull
        --build-arg additional_connector_args="--all"
        -t $IMAGE_NAME:$TAG
        -t $IMAGE_NAME:latest
        .
    # Inspect the built image to verify the local-sms-service connector is present
    - docker run --rm $IMAGE_NAME:$TAG ls /etc/logto/packages/connectors/connector-local-sms-service/lib/ | grep index.js
    # Push both the tagged and latest images
    - docker push $IMAGE_NAME:$TAG
    - docker push $IMAGE_NAME:latest
  only:
    - branches
    - tags
  except:
    - master
    - main
  # Cache image layers between pipeline runs to avoid re-downloading base layers.
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .docker/
  tags:
    - docker

# Push latest on master/main only.
.push-latest:
  extends: .build-push-docker
  stage: build
  only:
    - master
    - main
  tags:
    - docker

# -----------------------------------------------------------------------
# Stage 4: Security Scan
# -----------------------------------------------------------------------
.trivy-docker-scan:
  stage: .post
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  cache:
    paths:
      - .trivycache/
  variables:
    TRIVY_CACHE_DIR: .trivycache/
  script:
    # Scan the image we just pushed for critical vulnerabilities
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        REF="$CI_COMMIT_TAG"
      elif [ "$CI_MERGE_REQUEST_IID" ]; then
        REF="mr-$CI_MERGE_REQUEST_IID"
      else
        REF="$CI_COMMIT_BRANCH"
      fi
    - trivy image --exit-code 1 --severity CRITICAL --no-progress $IMAGE_NAME:$REF || true
    - trivy image --exit-code 0 --severity HIGH --no-progress $IMAGE_NAME:$REF || true
  only:
    - merge_requests
    - tags
  allow_failure: true

# -----------------------------------------------------------------------
# Stage 5: Integration Tests (runs against the just-pushed image)
# -----------------------------------------------------------------------
# Note: This job spins up the Logto container built above and runs a short
#       smoke test against its HTTP API to confirm the image boots correctly.
.e2e:
  image: alpine:3.19
  stage: e2e
  services:
    - postgres:17-alpine
    - redis:7-alpine
  variables:
    DB_URL: postgres://postgres:p0stgr3s@postgres:5432/logto
    REDIS_URL: redis://redis:6379
    TRUST_PROXY_HEADER: "1"
    PRIVATE_KEY_ROTATION_GRACE_PERIOD: "0"
  before_script:
    - apk add --no-cache curl postgresql-client
  script:
    # Pull the image we just built and started
    - docker pull $IMAGE_NAME:$CI_COMMIT_BRANCH || true
    - |
      docker run -d --rm \
        --name logto-e2e \
        -e DB_URL \
        -e REDIS_URL \
        -e TRUST_PROXY_HEADER \
        -e PRIVATE_KEY_ROTATION_GRACE_PERIOD \
        -p "3001:3001" \
        $IMAGE_NAME:$CI_COMMIT_BRANCH \
        sh -c "npm run cli db seed -- --swe && npm start"
    # Wait for Logto to become healthy
    - |
      echo "Waiting for Logto to start..."
      for i in $(seq 1 60); do
        if curl -sf http://localhost:3001/api/configs/admin-console > /dev/null 2>&1; then
          echo "Logto is healthy!"
          break
        fi
        echo "Logto is not ready yet. Waiting $i/60..."
        sleep 5
      done
    # Verify the connector API is reachable and list connectors
    - curl -sf -H "Authorization: Bearer test" http://localhost:3001/api/connectors | head -c 500
  after_script:
    # Stop the test container
    - docker rm -f logto-e2e 2>/dev/null || true
  only:
    - merge_requests
    - branches
  except:
    - main
    - master
    - tags
  tags:
    - docker
