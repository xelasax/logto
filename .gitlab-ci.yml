# GitLab CI/CD – development
#
# Pipeline is triggered MANUALLY from the GitLab UI.
# To run: Pipelines → Run pipeline → select `development` or `master`
#
# Published images (GitLab Container Registry):
#   <group>/<project>/logto:development   (feature branch)
#   <group>/<project>/logto:master                (stable / release)
#   <group>/<project>/logto:latest               (most recently published)
#
# Stages:
#   .pre    → lint         (lint only the connector – avoids upstream failures)
#   build   → build+push   (docker buildx, push to registry)
#   e2e     → smoke test   (pull from registry, curl health + connectors API)

stages:
  - .pre
  - build
  - deploy

# Workflow: pipeline is created on manual UI triggers or pushes to target branches.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "development"

variables:
  # $CI_REGISTRY_IMAGE is always correct regardless of GitLab host
  IMAGE_NAME: $CI_REGISTRY_IMAGE/logto
  # Enable BuildKit so Dockerfile RUN --mount works correctly in dind
  DOCKER_BUILDKIT: "1"
  PIP_NO_CACHE_DIR: "1"

# ─────────────────────────────────────────────────────────────────────────────
# Stage .pre – Lint (only the connector; full monorepo lint is not guarded)
# ─────────────────────────────────────────────────────────────────────────────
lint:
  stage: .pre
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    - npm add --location=global pnpm@^10.0.0
    - apk add --no-cache python3 make g++ bash
  cache:
    key: "${CI_COMMIT_REF_SLUG}-deps"
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    - pnpm i --frozen-lockfile
    # Build package dependencies to resolve types for TS/ESLint
    - pnpm --filter "@logto/connector-local-sms-service..." prepack
    # Scope to the connector we own so unrelated packages cannot fail the pipeline
    - pnpm --filter "@logto/connector-local-sms-service" lint

# ─────────────────────────────────────────────────────────────────────────────
# Stage build – Docker build, sanity check, and push to registry
#
# Triggered manually on development or master.
# Tags: :development / :master / :latest
# ─────────────────────────────────────────────────────────────────────────────
build-image:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
    - if: $CI_COMMIT_BRANCH == "master"
  before_script:
    # Authenticate with the GitLab Container Registry using the CI job token
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG="$CI_COMMIT_BRANCH"
      fi
      echo "Building image: $IMAGE_NAME:$TAG"

      # Use buildx so --mount cache directives in the Dockerfile work in dind
      docker buildx create --use --name logto-builder 2>/dev/null || true

      # Build -> load into local daemon -> verify -> push
      docker buildx build --pull \
        --progress=plain \
        --build-arg additional_connector_args="--cloud" \
        -t "$IMAGE_NAME:$TAG" \
        -t "$IMAGE_NAME:latest" \
        --load \
        .

      # Sanity check: connector binary must be present in the image
      docker run --rm --entrypoint sh "$IMAGE_NAME:$TAG" \
        -c "ls /etc/logto/packages/connectors/connector-local-sms-service/lib/" \
        | grep index.js

      # Push both tags to the GitLab Container Registry
      docker push "$IMAGE_NAME:$TAG"
      docker push "$IMAGE_NAME:latest"
      echo "Published → $IMAGE_NAME:$TAG"

# ─────────────────────────────────────────────────────────────────────────────
# Stage deploy – Deploy to Kubernetes (modern bitnami/kubectl authentication)
# ─────────────────────────────────────────────────────────────────────────────

# Kubectl Authentication template
.kubectl_k8s_auth:
  image:
    name: bitnami/kubectl:latest
    entrypoint: ["/bin/sh", "-c"]
  before_script:
    - |
      set -e
      export KUBECONFIG="${CI_PROJECT_DIR}/.kubeconfig"
      export DEPLOY_OVERLAY=$CI_ENVIRONMENT_NAME
      export K8S_NAMESPACE=auth

      case "$DEPLOY_OVERLAY" in
        development) APP_PREFIX="dev-" ;;
        staging) APP_PREFIX="staging-" ;;
        production) APP_PREFIX="prod-" ;;
        main) APP_PREFIX="main-" ;;
        *) echo "Invalid environment"; exit 1 ;;
      esac

      test -n "${K8S_CA_B64:-}"    || { echo "K8S_CA_B64 is not set";    exit 1; }
      test -n "${K8S_API_URL:-}"   || { echo "K8S_API_URL is not set";   exit 1; }

      ENV_UPPER=$(echo "$CI_ENVIRONMENT_NAME" | tr '[:lower:]' '[:upper:]')
      TOKEN_VAR="K8S_TOKEN_${ENV_UPPER}"
      eval "K8S_TOKEN=\${${TOKEN_VAR}}"
      test -n "${K8S_TOKEN:-}"     || { echo "${TOKEN_VAR} is not set";     exit 1; }

      K8S_API_URL="$(printf '%s' "$K8S_API_URL" | tr -d '\r\n')"
      if [ -f "$K8S_API_URL" ]; then K8S_API_URL=$(cat "$K8S_API_URL" | tr -d '\r\n'); fi

      if [ -f "$K8S_CA_B64" ]; then
        if grep -q "BEGIN CERTIFICATE" "$K8S_CA_B64"; then cp "$K8S_CA_B64" k8s-ca.crt
        else tr -d '\r\n\t ' < "$K8S_CA_B64" | base64 -d > k8s-ca.crt; fi
      elif printf '%s' "$K8S_CA_B64" | grep -q "BEGIN CERTIFICATE"; then printf '%s\n' "$K8S_CA_B64" > k8s-ca.crt
      else printf '%s' "$K8S_CA_B64" | tr -d '\r\n\t ' | base64 -d > k8s-ca.crt; fi

      kubectl config set-cluster k3s --server="$K8S_API_URL" --certificate-authority=k8s-ca.crt --embed-certs=true
      if [ -f "$K8S_TOKEN" ]; then K8S_TOKEN=$(cat "$K8S_TOKEN"); fi
      K8S_TOKEN="$(printf -- '%s' "$K8S_TOKEN" | tr -d '\r\n ')"

      kubectl config set-credentials gitlab-sa --token="$K8S_TOKEN"
      kubectl config set-context gitlab --cluster=k3s --user=gitlab-sa
      kubectl config use-context gitlab

# Sync configuration & secrets
.k8s_sync:
  extends: .kubectl_k8s_auth
  stage: deploy
  script:
    - |
      set -e
      kubectl apply -f "k8s/overlays/${CI_ENVIRONMENT_NAME}/namespace.yaml"

      ENVFILE="$(mktemp)"
      trap 'rm -f "$ENVFILE"' EXIT

      # Dynamic variable collection:
      APP_VARS_REGEX="^(LOGTO_|DB_|REDIS_|TRUST_PROXY_|PRIVATE_KEY_|SECRET_VAULT_|STATUS_API_|CASE_SENSITIVE_|USER_DEFAULT_|DATABASE_|TENANT_POOL_|DEV_FEATURES_|INTEGRATION_TEST|NODE_ENV|CLOUD_ENDPOINT|PATH_BASED_MULTI_TENANCY|IS_CLOUD|MULTIPLE_CUSTOM_DOMAINS_ENABLED|HTTPS_|POSTHOG_)"

      env | grep -E "$APP_VARS_REGEX" > "$ENVFILE" || true

      kubectl create secret generic ${APP_PREFIX}logto-secrets \
        --from-env-file="$ENVFILE" \
        -n auth \
        --dry-run=client -o yaml | kubectl apply -f -

      echo "Synced all matching environment variables to secret/${APP_PREFIX}logto-secrets in auth namespace"

      if [ -n "$DEPLOY_TOKEN_USER" ]; then
        kubectl create secret docker-registry gitlab-registry \
          --docker-server="$CI_REGISTRY" \
          --docker-username="$DEPLOY_TOKEN_USER" \
          --docker-password="$DEPLOY_TOKEN_PASSWORD" \
          -n auth \
          --dry-run=client -o yaml | kubectl apply -f -
      fi

# Deploy job template
.k8s_deploy:
  extends: .kubectl_k8s_auth
  stage: deploy
  script:
    - |
      set -e
      if [ "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG="$CI_COMMIT_BRANCH"
      fi
      APPLICATION_IMAGE="${IMAGE_NAME}:${TAG}"

      CLEAN_LOGTO_HOST=$(echo "${LOGTO_HOST:-${ENDPOINT:-logto.ghtickle.dev}}" | sed -E 's|^https?://||')
      CLEAN_LOGTO_ADMIN_HOST=$(echo "${LOGTO_ADMIN_HOST:-${ADMIN_ENDPOINT:-admin.logto.ghtickle.dev}}" | sed -E 's|^https?://||')

      kubectl apply -f "k8s/overlays/${CI_ENVIRONMENT_NAME}/namespace.yaml"
      kubectl kustomize "k8s/overlays/${CI_ENVIRONMENT_NAME}" \
        | sed "s|registry.invalid/logto:ci-placeholder|${APPLICATION_IMAGE}|g" \
        | sed "s|PLACEHOLDER_LOGTO_HOST|${CLEAN_LOGTO_HOST}|g" \
        | sed "s|PLACEHOLDER_LOGTO_ADMIN_HOST|${CLEAN_LOGTO_ADMIN_HOST}|g" \
        | sed "s|PLACEHOLDER_IP_1|${HOST_ALIAS_IP_1}|g" \
        | sed "s|PLACEHOLDER_IP_2|${HOST_ALIAS_IP_2}|g" \
        | sed "s|PLACEHOLDER_AUTH_DOMAIN|${HOST_ALIAS_AUTH_DOMAIN}|g" \
        | sed "s|PLACEHOLDER_ADMIN_DOMAIN|${HOST_ALIAS_ADMIN_DOMAIN}|g" \
        | sed -E "s/\"?REDEPLOY_TRIGGER_PLACEHOLDER\"?/\"${CI_PIPELINE_ID}\"/g" \
        | kubectl apply -f -

      kubectl rollout status deployment/${APP_PREFIX}logto -n auth --timeout=300s

# ─────────────────────────────────────────────────────────────────────────────
# Environment deployment definitions (triggered manually via UI/push rules)
# ─────────────────────────────────────────────────────────────────────────────

# Development
k8s:sync-gitlab-env:development:
  extends: .k8s_sync
  environment:
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      when: manual
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

deploy:k8s:development:
  extends: .k8s_deploy
  needs: ["build-image", "k8s:sync-gitlab-env:development"]
  environment:
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      when: manual
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

# Main
k8s:sync-gitlab-env:main:
  extends: .k8s_sync
  environment:
    name: main
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy:k8s:main:
  extends: .k8s_deploy
  needs: ["build-image", "k8s:sync-gitlab-env:main"]
  environment:
    name: main
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
