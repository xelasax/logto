# GitLab CI/CD – custom-oauth-server
# Every job runs ONLY on the `custom-oauth-server` branch.
# The Docker image is published to the GitLab Container Registry on every
# successful push when ALL stages pass.
#
# Registry path:
#   registry.gitlab.com/$CI_PROJECT_PATH/logto:custom-oauth-server

variables:
  REGISTRY: registry.gitlab.com
  # Enable BuildKit so Dockerfile layer-cache mounts work in dind
  DOCKER_BUILDKIT: "1"
  IMAGE_NAME: $CI_REGISTRY/$CI_PROJECT_PATH/logto

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 – Validate (lint only)
# Runs on push to custom-oauth-server. Type-check is intentionally excluded
# because workspace packages (@logto/connector-kit, @logto/language-kit) must
# be built before their types can be resolved; the Docker build stage already
# runs a full `pnpm -r build` which is the authoritative check.
# ─────────────────────────────────────────────────────────────────────────────
lint:
  stage: .pre
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
  before_script:
    - npm add --location=global pnpm@^10.0.0
    - apk add --no-cache python3 make g++ bash
  cache:
    key: "${CI_COMMIT_REF_SLUG}-deps"
    paths:
      - node_modules/
      - .pnpm-store/
  script:
    - pnpm i --frozen-lockfile
    # Lint only this connector (avoids unrelated upstream failures)
    - pnpm --filter @logto/connector-local-sms-service lint

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2 – Build Docker image and push to registry
# Triggers on every push to custom-oauth-server.
# The image is tagged :custom-oauth-server and :latest.
# ─────────────────────────────────────────────────────────────────────────────
.build-and-push:
  stage: build
  image: docker:26-cli
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
  services:
    - docker:26-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - TAG="$CI_COMMIT_BRANCH"
    - echo "Building image: $IMAGE_NAME:$TAG"
    - |
      docker build --pull \
        --build-arg additional_connector_args="--all" \
        -t "$IMAGE_NAME:$TAG" \
        -t "$IMAGE_NAME:latest" \
        .
    # Sanity check – confirm the local-sms-service connector is in the image
    - |
      docker run --rm "$IMAGE_NAME:$TAG" \
        ls /etc/logto/packages/connectors/connector-local-sms-service/lib/ \
        | grep index.js
    - echo "Pushing $IMAGE_NAME:$TAG …"
    - docker push "$IMAGE_NAME:$TAG"
    - echo "Pushing $IMAGE_NAME:latest …"
    - docker push "$IMAGE_NAME:latest"
    - echo "Image published: $IMAGE_NAME:$TAG"
  tags:
    - docker

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3 – E2E smoke test
# Starts the freshly published image and curls the health endpoint.
# Only runs after the image has been pushed successfully.
# ─────────────────────────────────────────────────────────────────────────────
.e2e:
  stage: e2e
  image: alpine:3.19
  rules:
    - if: $CI_COMMIT_BRANCH == "custom-oauth-server"
  services:
    - postgres:17-alpine
    - redis:7-alpine
  variables:
    DB_URL: postgres://postgres:p0stgr3s@postgres:5432/logto
    REDIS_URL: redis://redis:6379
    TRUST_PROXY_HEADER: "1"
    PRIVATE_KEY_ROTATION_GRACE_PERIOD: "0"
  before_script:
    - apk add --no-cache curl
  script:
    - docker pull "$IMAGE_NAME:$CI_COMMIT_BRANCH" || true
    - |
      docker run -d --rm \
        --name logto-e2e \
        -e DB_URL \
        -e REDIS_URL \
        -e TRUST_PROXY_HEADER \
        -e PRIVATE_KEY_ROTATION_GRACE_PERIOD \
        -p "3001:3001" \
        "$IMAGE_NAME:$CI_COMMIT_BRANCH" \
        sh -c "npm run cli db seed -- --swe && npm start"
    - |
      echo "Waiting for Logto to become healthy..."
      for i in $(seq 1 60); do
        if curl -sf http://localhost:3001/api/configs/admin-console > /dev/null 2>&1; then
          echo "Logto is healthy!"
          break
        fi
        echo "Waiting... ($i/60)"
        sleep 5
      done
    - curl -sf -H "Authorization: Bearer test" http://localhost:3001/api/connectors | head -c 500
  after_script:
    - docker rm -f logto-e2e 2>/dev/null || true
  tags:
    - docker
