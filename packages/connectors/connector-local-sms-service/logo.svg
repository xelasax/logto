<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Local SMS Service - Modern geometric design -->
  <!-- Outer hexagon: represents network, structure, local/community -->
  <path d="M12 3L21 8V16L12 21L3 16V8L12 3Z"
        fill="currentColor"
        stroke="none"/>
  <!-- Inner chat bubble: represents SMS/messaging -->
  <path d="M12 7C10.9 7 10 7.9 10 9V11C10 12.1 10.9 13 12 13C13.1 13 14 12.1 14 11V9C14 7.9 13.1 7 12 7Z"
        fill="white"/>
  <!-- Signal/transmission dots: three dots ascending (like message being sent) -->
  <circle cx="9" cy="10.5" r="0.8" fill="currentColor"/>
  <circle cx="12" cy="11.5" r="0.8" fill="currentColor"/>
  <circle cx="15" cy="10.5" r="0.8" fill="currentColor"/>
</svg>
